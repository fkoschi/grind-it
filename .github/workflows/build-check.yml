name: Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx oxlint

      - name: Format check
        run: npx oxfmt . --check

      - name: Run tests
        run: npx jest --ci --forceExit

  check-android:
    name: Check Android Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Install dependencies
        run: pnpm install

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install

      - name: Build Android (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

  check-ios:
    name: Check iOS Build
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.3"

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Ruby (for CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install dependencies
        run: pnpm install

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --no-install

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            pods-

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Create and boot iOS Simulator
        run: |
          # List available runtimes
          xcrun simctl list runtimes

          # Get the latest iOS runtime
          IOS_RUNTIME=$(xcrun simctl list runtimes | grep "iOS" | tail -1 | awk '{print $NF}')
          echo "Using iOS runtime: $IOS_RUNTIME"

          # Create simulator if it doesn't exist
          SIMULATOR_ID=$(xcrun simctl list devices | grep "iPhone 16" | grep -oE '\([A-F0-9-]+\)' | tr -d '()' | head -1)
          if [ -z "$SIMULATOR_ID" ]; then
            SIMULATOR_ID=$(xcrun simctl create "iPhone 16" com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$IOS_RUNTIME")
            echo "Created simulator: $SIMULATOR_ID"
          else
            echo "Using existing simulator: $SIMULATOR_ID"
          fi

          # Boot the simulator
          xcrun simctl boot "$SIMULATOR_ID" || true
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> $GITHUB_ENV

      - name: Build iOS (Debug)
        run: |
          xcodebuild \
            -workspace ios/GrindIt.xcworkspace \
            -scheme GrindIt \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=${{ env.SIMULATOR_ID }}" \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Install App on Simulator
        run: |
          xcrun simctl install booted build/Build/Products/Debug-iphonesimulator/GrindIt.app

      - name: Start Metro bundler
        run: |
          npx expo start --dev-client --port 8081 &
          for i in $(seq 1 30); do
            curl -s http://localhost:8081/status && break
            sleep 2
          done

      - name: Run Maestro Visual Tests
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 120000
        run: |
          maestro test .maestro/flows/dashboard.yml

      - name: Prepare screenshots for comparison
        if: always()
        run: |
          mkdir -p .maestro/screenshots/actual
          mv dashboard-empty.png .maestro/screenshots/actual/ || true

      - name: Compare screenshots against baseline
        run: |
          mkdir -p .maestro/screenshots/diff
          npx reg-cli \
            .maestro/screenshots/actual/dashboard-empty.png \
            .maestro/screenshots/baseline/dashboard-empty.png \
            .maestro/screenshots/diff/dashboard-empty.png \
            --matchingThreshold 0.05

      - name: Upload screenshot diff
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diff
          path: |
            .maestro/screenshots/actual/
            .maestro/screenshots/diff/
