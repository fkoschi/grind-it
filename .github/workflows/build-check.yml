name: Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx oxlint

      - name: Format check
        run: npx oxfmt . --check

      - name: Run tests
        run: npx jest --ci --forceExit

  check-android:
    name: Check Android Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Install dependencies
        run: pnpm install

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install

      - name: Build Android (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

  check-ios:
    name: Check iOS Build
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Ruby (for CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install dependencies
        run: pnpm install

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --no-install

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            pods-

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS (Debug)
        run: |
          xcodebuild \
            -workspace ios/GrindIt.xcworkspace \
            -scheme GrindIt \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16' \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Boot iOS Simulator
        run: |
          xcrun simctl boot "iPhone 16" || true

      - name: Install App on Simulator
        run: |
          xcrun simctl install booted build/Build/Products/Debug-iphonesimulator/GrindIt.app

      - name: Run Maestro Visual Tests
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 120000
        run: |
          maestro test .maestro/flows/dashboard.yml

      - name: Prepare screenshots for comparison
        if: always()
        run: |
          mkdir -p .maestro/screenshots/actual
          find ~/.maestro/tests -name "dashboard-empty.png" -exec cp {} .maestro/screenshots/actual/ \;

      - name: Compare screenshots against baseline
        run: |
          mkdir -p .maestro/screenshots/diff
          npx reg-cli \
            .maestro/screenshots/actual/dashboard-empty.png \
            .maestro/screenshots/baseline/dashboard-empty.png \
            .maestro/screenshots/diff/dashboard-empty.png \
            --matchingThreshold 0.05

      - name: Upload screenshot diff
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diff
          path: |
            .maestro/screenshots/actual/
            .maestro/screenshots/diff/
