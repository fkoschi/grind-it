name: Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check-android:
    name: Check Android Build
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: 🏗 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🏗 Prebuild Android
        run: npx expo prebuild --platform android --no-install

      - name: 🛠 Build Android (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

  check-ios:
    name: Check iOS Build
    runs-on: macos-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🏗 Prebuild iOS
        run: npx expo prebuild --platform ios --no-install

      - name: 📦 Install CocoaPods
        run: |
          cd ios
          pod install

      - name: 🛠 Build iOS (Debug)
        run: |
          xcodebuild -workspace ios/*.xcworkspace -scheme $(ls -d ios/*.xcworkspace | xargs basename -s .xcworkspace) -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
