name: Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx oxlint

      - name: Format check
        run: npx oxfmt . --check

      - name: Run tests
        run: npx jest --ci --forceExit

  check-android:
    name: Check Android Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Install dependencies
        run: pnpm install

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install

      - name: Build Android (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

  check-ios:
    name: Check iOS Build
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.3"

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Ruby (for CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install dependencies
        run: pnpm install

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --no-install

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            pods-

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS app (archive validation)
        run: |
          xcodebuild \
            -workspace ios/GrindIt.xcworkspace \
            -scheme GrindIt \
            -configuration Release \
            -derivedDataPath build \
            -archivePath build/GrindIt.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO 2>&1 | head -100
